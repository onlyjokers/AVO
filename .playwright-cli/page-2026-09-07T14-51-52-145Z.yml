      - paragraph [ref=f1e90]: 直接比较全部四张候选后，选择 x0。它的道路从近景到消失点保持笔直，左右前景山体之间有明确的开放谷地；夕阳暖光、路面反射和天空渐变自然，路面细颗粒及岩石植被也最接近真实摄影。x1 的两侧山坡汇聚和框景确实更明确，但近景路面已出现不自然的虫纹状、浮雕状纹理；x2 强化橙色光路的同时进一步凸显该纹理，x3 虽降低橙色浓度、提亮暗部，却使这种遍布路面的异常纹理更加显眼，植被也更有描绘感。后三者的构图收益不足以抵消真实性与画质硬约束上的损失。x0 的山体引导感和太阳辉光尺度仍不及参考，但已有自然光感与连续辉光，在不得以目标接近牺牲真实性的前提下，是更稳妥的最终选择。
